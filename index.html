<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D虚拟服装试穿平台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: "Microsoft YaHei",sans-serif}
        body{background:#f8f9fa;padding:20px}
        .container{max-width:1100px;margin:0 auto}
        header{text-align:center;margin:30px 0}
        h1{font-size: 28px;color:#222;margin-bottom:8px}
        .subtitle{color:#666;font-size:16px}
        
        .box{
            display:flex;
            flex-wrap:wrap;
            gap:30px;
            justify-content:center;
            align-items:flex-start
        }

        #canvas{
            width:500px;
            height:700px;
            background:#fff;
            border-radius:16px;
            box-shadow:0 8px 30px rgba(0,0,0,0.08)
        }

        .panel{
            width:320px;
            background:#fff;
            padding:28px;
            border-radius:16px;
            box-shadow:0 8px 30px rgba(0,0,0,0.08)
        }
        .panel h3{margin-bottom:20px;color:#333;font-size:18px}
        .btn{
            width:100%;
            padding:14px;
            margin:10px 0;
            background:#ff5983;
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:15px;
            cursor:pointer
        }
        .btn:hover{background:#e63968}

        .tips{margin-top:25px;color:#777;line-height:1.6;font-size:14px}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>3D虚拟服装试穿平台</h1>
            <p class="subtitle">基于Web3D技术 | 沉浸式虚拟试衣 | 大学生创新创业项目</p>
        </header>

        <div class="box">
            <div id="canvas"></div>
            <div class="panel">
                <h3>虚拟换装</h3>
                <button class="btn" onclick="setClothes(1)">白色连衣裙</button>
                <button class="btn" onclick="setClothes(2)">粉色休闲装</button>
                <button class="btn" onclick="setClothes(3)">蓝色牛仔套装</button>
                <button class="btn" onclick="setClothes(0)">还原默认</button>

                <div class="tips">
                    <p>🖱 鼠标拖动：360°旋转查看</p>
                    <p>🖱 鼠标滚轮：放大/缩小</p>
                    <p>👗 点击按钮：一键换装</p>
                </div>
            </div>
        </div>
    </div>

<!-- 更换国内稳定镜像CDN，解决空白加载失败问题 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene,camera,renderer,controls,person,clothes=null;
        init();loop();

        function init(){
            scene=new THREE.Scene();
            scene.background=new THREE.Color(0xf8f9fa);
            camera=new THREE.PerspectiveCamera(50,500/700,.1,1000);
            camera.position.set(0,0.4,5);
            renderer=new THREE.WebGLRenderer({antialias:true});
            renderer.setSize(500,700);
            document.getElementById("canvas").appendChild(renderer.domElement);
            
            // 加强灯光，防止模型看不见
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(3, 5, 4);
            scene.add(ambientLight, dirLight);

            controls=new THREE.OrbitControls(camera,renderer.domElement);
            controls.enableDamping=true;

            person=new THREE.Group();
            scene.add(person);
            // 人体躯干
            const body=new THREE.Mesh(new THREE.CylinderGeometry(.3,.34,1.7,16),new THREE.MeshLambertMaterial({color:0xffdbac}));
            // 头部
            const head=new THREE.Mesh(new THREE.SphereGeometry(.39,16,16),new THREE.MeshLambertMaterial({color:0xffdbac}));
            head.position.y=1.15;
            person.add(body,head);
            setClothes(1);
        }

        function setClothes(t){
            if(clothes)person.remove(clothes);
            let g=new THREE.CylinderGeometry(.35,.5,1.15,16);
            let m;
            if(t===1)m=new THREE.MeshLambertMaterial({color:0xffffff});
            else if(t===2)m=new THREE.MeshLambertMaterial({color:0xf8bbd0});
            else if(t===3)m=new THREE.MeshLambertMaterial({color:0x42a5f5});
            else m=new THREE.MeshLambertMaterial({color:0xffffff});
            clothes=new THREE.Mesh(g,m);
            clothes.position.y=-.2;
            person.add(clothes);
        }

        function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);}
    </script>
</body>
</html>
