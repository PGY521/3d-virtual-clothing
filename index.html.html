<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D虚拟服装试穿平台</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
        body{background:#f5f5f5;padding:20px}
        .container{max-width:1200px;margin:0 auto}
        header{text-align:center;margin-bottom:30px}
        h1{color:#333;margin-bottom:10px}
        .main{display:flex;gap:30px;justify-content:center}
        
        /* 3D展示区域 */
        #canvas{
            width:500px;
            height:700px;
            background:white;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.1)
        }

        /* 换装按钮区 */
        .control{
            width:300px;
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.1)
        }
        .control h3{margin-bottom:15px;color:#555}
        .btn{
            display:block;
            width:100%;
            padding:12px;
            margin:8px 0;
            background:#ff6b81;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer
        }
        .btn:hover{background:#e5536d}

        .tips{margin-top:20px;color:#777;font-size:14px}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>3D虚拟服装试穿平台</h1>
            <p>基于Web3D技术 · 沉浸式虚拟试衣 · 大学生创新创业项目</p>
        </header>

        <div class="main">
            <!-- 3D模型展示区 -->
            <div id="canvas"></div>

            <!-- 换装控制面板 -->
            <div class="control">
                <h3>快速换装</h3>
                <button class="btn" onclick="changeDress(1)">白色连衣裙</button>
                <button class="btn" onclick="changeDress(2)">粉色休闲装</button>
                <button class="btn" onclick="changeDress(3)">蓝色牛仔套装</button>
                <button class="btn" onclick="resetModel()">还原默认</button>

                <div class="tips">
                    <p>✅ 鼠标拖动：360°旋转查看</p>
                    <p>✅ 滚轮：放大/缩小</p>
                    <p>✅ 一键换装：实时显示效果</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入3D引擎（Three.js，行业标准） -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ========== 3D场景初始化 ==========
        let scene, camera, renderer, model, controls;
        init();
        animate();

        function init() {
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfafafa);

            // 相机
            camera = new THREE.PerspectiveCamera(50, 500/700, 0.1, 1000);
            camera.position.z = 5;

            // 渲染器
            renderer = new THREE.WebGLRenderer({antialias:true});
            renderer.setSize(500,700);
            document.getElementById('canvas').appendChild(renderer.domElement);

            // 灯光
            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
            scene.add(light);

            // 鼠标控制
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 创建基础人体模型（比赛演示用）
            createHumanModel();
        }

        // ========== 创建虚拟人体 ==========
        function createHumanModel() {
            const group = new THREE.Group();
            scene.add(group);
            model = group;

            // 身体
            const bodyGeo = new THREE.CylinderGeometry(0.3,0.35,1.8,16);
            const bodyMat = new THREE.MeshLambertMaterial({color:#ffdbac});
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0;
            group.add(body);

            // 头部
            const headGeo = new THREE.SphereGeometry(0.4,16,16);
            const headMat = new THREE.MeshLambertMaterial({color:#ffdbac});
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.3;
            group.add(head);

            // 默认衣服
            createDress(1);
        }

        // 临时衣服对象
        let currentClothes = null;

        // ========== 换装核心函数 ==========
        function createDress(type) {
            if(currentClothes) model.remove(currentClothes);
            const group = new THREE.Group();
            
            let color, height;
            if(type===1){ color="#ffffff"; height=-0.2 }
            if(type===2){ color="#f8bbd0"; height=-0.3 }
            if(type===3){ color="#42a5f5"; height=-0.4 }

            const geo = new THREE.CylinderGeometry(0.35,0.5,1.2,16);
            const mat = new THREE.MeshLambertMaterial({color:color});
            const dress = new THREE.Mesh(geo, mat);
            dress.position.y = height;
            group.add(dress);
            model.add(group);
            currentClothes = group;
        }

        function changeDress(type) { createDress(type) }
        function resetModel() { createDress(1) }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
